<!--

date: {{DATE}}
tags: {{TAGS_RAW_COMMENT}}
description: {{DESCRIPTION_RAW_COMMENT}}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<link rel="stylesheet" href="/styles/main.min.css?v=20260713e">
<link rel="stylesheet" href="/styles/custom.css?v=20260713r4h">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>:root { --heatmap-color: #E30613; }</style>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('flavor-theme');
      var theme = saved || 'dark';
      if (theme === 'light') {
        document.documentElement.classList.add('theme-light');
      }
    } catch (e) { }
  })();
</script>
  <meta name="generator" content="Miracle 1.1.1">
  <title>{{TITLE}} | Miracle</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{URL}}">
<script type="application/ld+json">{{LD_JSON}}</script>
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Miracle">
<meta property="article:published_time" content="{{DATE}}">
{{TAGS_META}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{URL}}">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
</head>
<body class="flavor-theme">

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <div class="top-bar">
      <div class="top-bar__left">
        <a href="{{SITE}}" class="site-avatar-link" aria-label="home">
          <img class="site-avatar" src="/images/avatar.png" alt="Miracle" />
        </a>
        <a href="{{SITE}}" class="site-name-link">Miracle</a>
      </div>
      <nav class="top-bar__nav" id="sectionBar">
        <a class="nav-item" href="/">首页</a>
        <a class="nav-item active" href="/post/">博客</a>
        <a class="nav-item" href="/memos/">闪念</a>
        <a class="nav-item" href="/post/about/">关于</a>
      </nav>
      <div class="top-bar__right">
        <button class="btn-icon btn-search search-btn" id="btnSearch" type="button" aria-label="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <button class="btn-icon theme-toggle" id="btnTheme" type="button" aria-label="theme">
          <svg class="theme-toggle-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="theme-toggle-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>
<div class="header-spacer"></div>

  <main class="site-main" role="main">
    <div class="article-container">
      <article>
        <header class="article-header">
          <h1 class="article-title">{{TITLE}}</h1>
          <div class="article-meta">
            <span class="article-meta__item">{{DATE}}</span>
            <span class="article-meta__sep">·</span>
            <span class="article-meta__tags" aria-label="标签">
{{TAGS_HTML}}
          </span>
          </div>
        </header>
        <div class="article-content">
{{BODY}}
</div>
      </article>
    </div>
  </main>

<footer class="site-footer">
  <div class="footer-inner">
    <nav class="footer-nav" aria-label="footer">
      <a class="footer-nav__link" href="/">首页</a>
      <a class="footer-nav__link" href="/post/">博客</a>
      <a class="footer-nav__link" href="/memos/">闪念</a>
      <a class="footer-nav__link" href="/archives/">归档</a>
      <a class="footer-nav__link" href="/tags/">标签</a>
      <a class="footer-nav__link" href="/post/about/">关于</a>
    </nav>
    <div class="footer-social">
      <a class="footer-social__link" href="/feed.xml" aria-label="RSS">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6.18 15.64a2.18 2.18 0 110 4.36 2.18 2.18 0 010-4.36zM4 4.44A15.56 15.56 0 0119.56 20h-2.83A12.73 12.73 0 004 7.27V4.44zm0 5.66a9.9 9.9 0 019.9 9.9h-2.83A7.07 7.07 0 004 12.93V10.1z"/>
        </svg>
      </a>
    </div>
    <div class="footer-copyright">
      <p>&copy; 2026 Miracle. All rights reserved.</p>
    </div>
    <div class="footer-powered">
      <span>Powered by <a href="https://gridea.pro" target="_blank" rel="noopener noreferrer">Miracle</a></span>
    </div>
  </div>
</footer>

  <div class="search-overlay" id="searchOverlay" style="display:none !important;">
  <div class="search-modal">
    <div class="search-header">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input class="search-input" id="searchInput" type="search" placeholder="搜索文章..." autocomplete="off" />
      <button class="search-close" id="searchClose" type="button" aria-label="close">×</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>
  <script src="/scripts/search.js"></script>
</body>
</html>
